search:
  days_back: 7
  max_results: 200
  top_n: 10
  detailed_top_n: 10
study_type_scores:
  Randomized Controlled Trial: 10
  Meta-Analysis: 9
  Systematic Review: 9
  Clinical Trial: 8
  Multicenter Study: 7
  Observational Study: 6
  Cohort Study: 6
  Practice Guideline: 10
  Guideline: 10
  Review: 4
  Case Reports: 1
  Editorial: 2
  Comment: 1
  Letter: 1
exclude_types:
- Case Reports
- Editorial
- Comment
- Letter
- Published Erratum
clinical_relevance:
  high_value:
  - cardiovascular death
  - all-cause mortality
  - heart failure hospitalization
  - myocardial infarction
  - cardiovascular events
  - major adverse cardiac events
  - ischemic stroke
  - cardiac arrest
  - sudden cardiac death
  practical:
  - guideline recommendations
  - randomized controlled trial
  - real-world evidence
  - clinical outcomes
  - risk stratification
  - risk score
  japan_relevant:
  - japanese
  - asian
  - japan
  - east asian
basic_science_exclude:
- in vitro
- mouse model
- rat model
- cell line
- ex vivo
- murine
- knockout mice
- animal model
- zebrafish
ai:
  model_chain:
  - gemini-3.8-flash
  - gemini-3.6-flash
  - gemini-3.5-flash-lite
  - gemini-3.1-flash-lite
  timeout: 180
  max_retries: 3
  retry_delay: 5
triage:
  enabled: true
  pool_size: 40
  exclude_categories:
  - basic
  - genetic
  - other
  design_scores:
    rct: 10
    guideline: 10
    meta_analysis: 9
    prospective_cohort: 7
    registry: 6
    diagnostic: 6
    retrospective: 5
    cross_sectional: 4
    review: 4
    other: 3
fulltext:
  enabled: true
  max_chars: 60000
  min_chars: 2000
alert:
  summary_failure_ratio: 0.5
output:
  directory: output
  filename_format: 医学論文レビュー_{date}.docx
history:
  file: history.json
  retention_days: 180
specialty_name: 循環器内科
